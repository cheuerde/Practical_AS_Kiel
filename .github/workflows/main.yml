# .github/workflows/main.yml
name: Render Quarto and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install pak
        run: |
          Rscript -e '
          repo <- Sys.getenv("RSPM", unset = "https://cloud.r-project.org")
          if (!nzchar(repo)) repo <- "https://cloud.r-project.org"
          install.packages("pak", repos = repo)
          '

      - name: Install R dependencies
        run: |
          Rscript -e '
          source("R/packages.R")
          packages <- course_packages()
          pak::pkg_install(packages, ask = FALSE)
          missing <- missing_packages(packages)
          if (length(missing)) {
            stop("Missing R packages after install: ", paste(missing, collapse = ", "))
          }
          '

      - name: Render Quarto site
        run: quarto render

      - name: Build PDF exports
        run: scripts/build-pdfs.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
